kind = "web"
previewPath = "/"
title = "Jacadi Paris"
description = "A Jacadi Paris Saudi catalogue with product browsing, imported editorial pages, search, wishlist, a temporary shortlist, and links to Jacadi.sa for ordering."
version = "1.0.0"
id = "artifacts/lille-nest"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25212

[services.development]
run = "pnpm --filter @workspace/lille-nest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lille-nest", "run", "build" ]
serve = "static"
publicDir = "artifacts/lille-nest/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25212"
BASE_PATH = "/"